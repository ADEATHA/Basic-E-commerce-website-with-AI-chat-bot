<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Staff Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500">
            ManagerPro
        </div>
        <div class="space-x-6 text-sm font-medium flex items-center">
            <a href="{% url 'staff_dashboard' %}" class="hover:text-blue-400 transition">Dashboard</a>
            <a href="{% url 'staff_import_product' %}" class="text-indigo-400 bg-indigo-500/10 px-4 py-2 rounded-lg hover:bg-indigo-500/20 transition">📦 Stock Management</a>
            {% if user.is_authenticated %}
                <span class="text-slate-400 border-l border-slate-700 pl-6">👤 {{ user.username }}</span>
                <a href="{% url 'staff_logout' %}" class="text-rose-400 border border-rose-400/30 px-4 py-2 rounded-lg hover:bg-rose-400/10 transition">Logout</a>
            {% else %}
                <a href="{% url 'staff_login' %}" class="text-indigo-400 border border-indigo-400/30 px-4 py-2 rounded-lg hover:bg-indigo-400/10 transition">Login</a>
            {% endif %}
        </div>
    </nav>
    
    <!-- Content -->
    <main class="flex-grow p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
