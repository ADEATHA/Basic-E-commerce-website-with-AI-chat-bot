{% extends 'staff/base.html' %}
{% block title %}Import Products | StaffPortal{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <header class="flex items-center space-x-4 bg-slate-800/50 p-6 rounded-2xl glass">
        <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-xl flex items-center justify-center text-2xl">📦</div>
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Import Products (DDD)</h1>
            <p class="text-slate-400 text-sm mt-1">Add new inventory across all global categories.</p>
        </div>
    </header>

    <div class="glass p-8 rounded-2xl border border-slate-700">
        <form class="space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Category Name</label>
                <select class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                    <option value="Mobile">📱 Mobile Devices</option>
                    <option value="Computer">💻 Computer Systems</option>
                    <option value="Clothes">👕 Fashion & Clothes</option>
                    <option value="Shoes">👟 Shoes & Footwear</option>
                    <option value="Watches">⌚ Watches</option>
                    <option value="Cosmetics">💄 Cosmetics & Beauty</option>
                    <option value="Furniture">🛋️ Furniture</option>
                    <option value="Kitchenware">🍳 Kitchenware</option>
                    <option value="Books">📚 Books</option>
                    <option value="Sportswear">🏃 Sportswear</option>
                    <option value="Accessories">🕶️ Accessories</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Brand</label>
                    <input type="text" placeholder="e.g. Samsung, Apple, Nike" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Product Name</label>
                    <input type="text" placeholder="e.g. Galaxy S24, Air Max" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Price (USD)</label>
                    <input type="number" step="0.01" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Quantity</label>
                    <input type="number" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">Dynamic Attributes (JSON)</label>
                <textarea rows="3" placeholder='{"size": "42", "color": "White"}' class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition font-mono text-sm"></textarea>
            </div>

            <button type="button" onclick="submitImport()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition mt-4 shadow-lg shadow-indigo-500/20">
                Submit Product Import
            </button>
        </form>
    </div>
</div>

<script>
    async function submitImport() {
        const form = document.querySelector('form');
        const data = {
            category_name: form.querySelector('select').value,
            brand: form.querySelectorAll('input')[0].value,
            name: form.querySelectorAll('input')[1].value,
            price: parseFloat(form.querySelectorAll('input')[2].value),
            stock: parseInt(form.querySelectorAll('input')[3].value),
            description: form.querySelector('textarea').value
        };

        if(!data.brand || !data.name || isNaN(data.price)) {
            alert("Please fill in all required fields.");
            return;
        }

        try {
            const response = await fetch('/api/product/add-product/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("✅ Product imported successfully!");
                form.reset();
            } else {
                const err = await response.json();
                alert("❌ Error: " + (err.error || "Unknown error"));
            }
        } catch (e) {
            alert("❌ Connection error: " + e.message);
        }
    }
</script>
{% endblock %}
