<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Register | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0f172a; }</style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background styling -->
    <div class="absolute inset-0 z-0">
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    </div>

    <!-- Register Box -->
    <div class="relative z-10 w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 p-8 rounded-3xl shadow-2xl mt-8 mb-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Onboarding</h1>
            <p class="text-slate-400 mt-2">Create a new staff account.</p>
        </div>

        <form method="post" action="{% url 'staff_register' %}" class="space-y-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-300">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-400 text-xs">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-500/30">
                Register
            </button>
        </form>

        <p class="text-slate-400 text-sm text-center mt-6">
            Already have an account? <a href="{% url 'staff_login' %}" class="text-emerald-400 hover:text-emerald-300 transition">Sign in</a>
        </p>
    </div>

    <!-- Django Form Styling Overrides via CSS -->
    <style>
        input[type="text"], input[type="password"] {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(51, 65, 85, 1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 1px #10b981;
        }
        ul.errorlist {
            color: #f87171;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            list-style-type: none;
            padding: 0;
        }
    </style>
</body>
</html>
