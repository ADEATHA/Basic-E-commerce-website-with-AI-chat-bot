<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Control Center{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; }
        .admin-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .admin-sidebar { border-right: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 admin-sidebar admin-glass flex flex-col">
        <div class="p-8">
            <div class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-500 tracking-tighter">
                CORE ADMIN
            </div>
            <p class="text-[10px] text-slate-500 uppercase tracking-[0.2em] font-bold mt-1">System Authority</p>
        </div>

        <nav class="flex-grow px-4 space-y-2">
            <a href="{% url 'admin_dashboard' %}" class="flex items-center space-x-3 p-4 rounded-xl hover:bg-emerald-500/10 hover:text-emerald-400 transition group">
                <span class="text-xl group-hover:scale-110 transition">📊</span>
                <span class="font-medium text-sm">Overview</span>
            </a>
            <a href="#" class="flex items-center space-x-3 p-4 rounded-xl hover:bg-emerald-500/10 hover:text-emerald-400 transition group">
                <span class="text-xl group-hover:scale-110 transition">👤</span>
                <span class="font-medium text-sm">User Accounts</span>
            </a>
            <a href="/admin/" class="flex items-center space-x-3 p-4 rounded-xl hover:bg-emerald-500/10 hover:text-emerald-400 transition group">
                <span class="text-xl group-hover:scale-110 transition">🛠️</span>
                <span class="font-medium text-sm">Database CRUD</span>
            </a>
        </nav>

        <div class="p-6 border-t border-slate-800">
            <div class="flex items-center space-x-3 p-3 bg-slate-900/50 rounded-2xl border border-slate-800">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center font-bold text-slate-900">A</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-bold text-white truncate">{{ user.username }}</p>
                    <p class="text-[10px] text-emerald-500 font-bold uppercase">Root Admin</p>
                </div>
            </div>
            <a href="{% url 'staff_logout' %}" class="block mt-4 text-center text-xs text-slate-500 hover:text-rose-400 transition">Logout System</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-10 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
