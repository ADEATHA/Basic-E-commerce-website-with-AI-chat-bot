<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Core System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; }
        .admin-glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(16, 185, 129, 0.1); }
        .input-field { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s; }
        .input-field:focus { border-color: #10b981; box-shadow: 0 0 0 1px #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md space-y-8">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-6">
                <span class="text-3xl">🛡️</span>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-white">System Authority</h1>
            <p class="text-slate-400 mt-2 text-sm uppercase tracking-widest font-bold">Admin Portal Login</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="p-4 rounded-xl {% if message.tags == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %} text-xs font-bold text-center">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <div class="admin-glass p-8 rounded-[2.5rem] shadow-2xl">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Username</label>
                    <input type="text" name="username" required class="w-full input-field rounded-2xl px-5 py-4 text-white focus:outline-none placeholder-slate-600" placeholder="admin_user">
                </div>
                
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Password</label>
                    <input type="password" name="password" required class="w-full input-field rounded-2xl px-5 py-4 text-white focus:outline-none placeholder-slate-600" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-2xl transition-all transform active:scale-95 shadow-lg shadow-emerald-500/20">
                    AUTHORIZE ACCESS
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-800 text-center">
                <p class="text-slate-500 text-sm">
                    Don't have an admin account? <br>
                    <a href="{% url 'admin_register' %}" class="text-emerald-400 hover:text-emerald-300 font-bold transition">Register as System Admin</a>
                </p>
            </div>
        </div>

        <p class="text-center text-[10px] text-slate-600 font-bold uppercase tracking-[0.2em]">MegaStore Infrastructure v2.0</p>
    </div>
</body>
</html>
