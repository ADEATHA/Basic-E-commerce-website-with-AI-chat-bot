<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MegaStore{% endblock %}</title>
    <meta name="description" content="MegaStore - Nền tảng mua sắm thông minh tích hợp AI, checkout đa dịch vụ và theo dõi đơn hàng theo thời gian thực.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at top, #fff7ed, #fafaf9 45%); color: #1c1917; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header>
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-stone-200">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="text-3xl font-extrabold text-orange-600 tracking-tight">
                    MegaStore.
                </div>
                <div class="space-x-8 font-medium text-stone-600 flex items-center">
                    <a id="nav-shop" href="{% url 'shop' %}" class="hover:text-orange-600 transition">Shop</a>
                    <a id="nav-cart" href="{% url 'cart' %}" class="relative hover:text-orange-600 transition">
                        Cart 🛒
                        <span id="cart-count" class="absolute -top-2 -right-3 bg-orange-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                    </a>
                    <a id="nav-track" href="{% url 'tracking' %}" class="hover:text-orange-600 transition">Track Order</a>

                    {% if user.is_authenticated %}
                        <div class="flex items-center space-x-4 border-l border-stone-200 pl-8">
                            <span class="text-stone-400 text-sm">👤 {{ user.username }}</span>
                            <a id="nav-logout" href="{% url 'logout' %}" class="text-stone-600 hover:text-orange-600 transition">Logout</a>
                        </div>
                    {% else %}
                        <a id="nav-login" href="{% url 'login' %}" class="px-5 py-2 bg-stone-900 text-white rounded-full hover:bg-orange-600 transition">Sign In</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <script>
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const countEl = document.getElementById('cart-count');
            let totalQty = 0;
            cart.forEach(item => {
                totalQty += parseInt(item.quantity || 1);
            });
            if (totalQty > 0) {
                countEl.innerText = totalQty;
                countEl.classList.remove('hidden');
            } else {
                countEl.classList.add('hidden');
            }
        }
        document.addEventListener('DOMContentLoaded', updateCartCount);
    </script>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-stone-900 text-stone-400 py-8 text-center mt-12">
        <p>&copy; 2026 MegaStore Inc. All rights reserved.</p>
    </footer>
</body>
</html>
